<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editorial workspace · Samuel Okotako</title><link rel="stylesheet" href="admin.css"></head>
<body><a class="skip" href="#main">Skip to content</a><header><strong>Editorial workspace</strong><span>Private authoring preview</span></header><main id="main">
<p id="status" role="status" aria-live="polite">Loading configuration…</p>
<section id="loginPanel" hidden><h1>Sign in</h1><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section>
<section id="editorPanel" hidden><div class="toolbar"><h1>Articles</h1><button type="button" id="logout">Sign out</button></div><label>Open article<select id="articleList"><option value="">New article</option></select></label><form id="articleForm"><label>Shared URL slug<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100"></label><label>Category<input name="category" maxlength="100"></label><label>Tags, separated by commas<input name="tags" maxlength="300"></label><label>Language<select name="language"><option value="en">English</option><option value="it">Italiano</option><option value="fr">Français</option></select></label><label>Title<input name="title" required maxlength="200"></label><label>Summary<textarea name="summary" rows="3" required></textarea></label><label>Body (Markdown)<textarea name="body" rows="18" required></textarea></label><label>SEO title<input name="seo_title" maxlength="200"></label><label>SEO description<textarea name="seo_description" rows="2"></textarea></label><label>LinkedIn draft<textarea name="linkedin" rows="4"></textarea></label><fieldset><legend>Private cover upload</legend><label>Image<input name="cover" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><p>Uploads remain private until rights and publication are reviewed.</p></fieldset><div class="actions"><button type="button" id="preview">Preview</button><button type="submit" id="save">Save draft</button><button type="button" id="publish">Publish this language</button><button type="button" id="withdraw">Withdraw this language</button></div></form><section id="previewPanel" hidden><h2>Preview</h2><h3 id="previewTitle"></h3><p id="previewSummary"></p><pre id="previewBody"></pre></section></section>
</main><script src="admin.js" defer></script></body></html>
